<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eid Mubarak - Dumpling Celebration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Festive&display=swap" rel="stylesheet">
    <style>
        /* Base Scene & Night Sky */
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: linear-gradient(180deg, #0d1b2a 0%, #756e0f 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            overflow: hidden;
            position: relative;
        }

        /* Smooth Gradient Transition Overlay */
        body::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, #e9eb98 0%, #eb972b 100%);
            z-index: 0;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            pointer-events: none;
        }
        body.yes::after {
            opacity: 1;
        }

        /* --- THE POPPING SUN --- */
        .sun {
            position: absolute;
            top: -150px;
            left: -150px;
            width: 130px;
            height: 130px;
            background: radial-gradient(circle, #fff3b0 20%, #ffb703 100%);
            border-radius: 50%;
            box-shadow: 0 0 40px rgba(255, 183, 3, 0.8), 0 0 80px rgba(255, 214, 10, 0.5);
            z-index: 1; 
            transition: all 2s cubic-bezier(0.34, 1.56, 0.64, 1); 
        }
        .sun.show {
            top: 40px;
            left: 40px;
        }
        
        /* --- RESPONSIVE TYPOGRAPHY BOX --- */
        .mainText {
            text-align: center;
            position: absolute;
            top: 8%;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 800px;
            z-index: 15;
            pointer-events: none;
        }

        /* Adaptive Headings */
        h1 {
            font-family: "Festive", cursive;
            font-size: clamp(2.8rem, 5vw, 4rem);
             font-weight: 400;
            text-shadow: 0 0 15px rgba(185, 169, 183, 0.4);
            opacity: 0;
            transform: translateY(-50px);
            transition: all 1.5s cubic-bezier(0.4, 0, 0.2, 1);
            margin-bottom: 15px;
        }
        body.yes h1 {
            color: #c28cce;
            text-shadow: none;
        }
        h1.show {
            opacity: 1;
            transform: translateY(0);
        }

        h2 {
            font-size: clamp(1.1rem, 2vw, 1.6rem);
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.74);
            font-weight: 400;
            line-height: 1.5;
            opacity: 0;
            transform: translateY(30px);
            transition: all 1.5s cubic-bezier(0.4, 0, 0.2, 1) 0.3s;
            margin: 0;
        }
        body.yes h2 {
            color: #ffffff;
            text-shadow: none;
        }
        h2.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* --- CONTAINER POSITIONING --- */
        .container {
            text-align: center;
            position: absolute;
            bottom: 30%; 
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 400px;
        }

        /* --- BACKGROUND SCENERY --- */
        .mountains {
            position: absolute;
            bottom: 30%;
            left: 0;
            width: 100%;
            height: 30vh;
            z-index: 2; 
            display: flex;
            justify-content: space-around;
        }

        .mountain {
            position: absolute;
            background: #2a4d3c;
            border-top: 3px solid #66af8d;
            transform: rotate(45deg);
            opacity: 0.8;
        }
        .mountain-1 { width: 30vw; height: 30vw; left: -10vw; bottom: -15vw; }
        .mountain-2 { width: 25vw; height: 25vw; left: 15vw; bottom: -15vw; }
        .mountain-3 { width: 30vw; height: 30vw; right: 15vw; bottom: -15vw; }
        .mountain-4 { width: 25vw; height: 25vw; right: -10vw; bottom: -15vw; }

        .ground {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 30%;
            background-color: #302f2e;
            z-index: 3;
            transition: background-color 1.5s ease-in-out;
        }
        .ground.changed {
            background-color: #696454; 
        }

        /* --- CENTRAL INTERACTIVE ELEMENT --- */
        .scene-group {
            position: relative;
            cursor: pointer;
            width: 250px;
            height: 140px; 
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        .dumpling {
            position: relative;
            top: 15px;
            width: 120px;
            height: 100px;
            background-color: #fdfae6;
            border-radius: 50% 50% 40% 40%;
            box-shadow: 0 5px 10px rgba(0,0,0,0.2);
            transition: transform 0.2s ease;
            z-index: 5;
        }
        .scene-group:hover .dumpling {
            transform: translateY(-5px) scale(1.02);
        }

        /* --- THE CELEBRATION GOAT --- */
        .goat {
            position: absolute;
            bottom: -15px; /* Perfectly aligns its hooves onto the shifted ground line */
            right: 200px;  /* Stands it right next to the dumpling */
            height: 125px; /* Scales beautifully next to the dumpling */
            z-index: 5;
            opacity: 0;
            transform: scale(0) rotate(-15deg);
            transform-origin: bottom center;
            /* Pops up with an elegant, energetic spring bounce right after the sun arrives */
            transition: all 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) 0.4s; 
        }
        .goat.show {
            opacity: 1;
            transform: scale(1) rotate(0deg);
        }

        .dumpling-face {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            gap: 20px;
        }
        .eye { width: 8px; height: 8px; background-color: #333; border-radius: 50%; }
        
        .blush { 
            position: absolute;
            top: 45%;
            left: 15px;
            width: 12px;
            height: 8px;
            background-color: #ffb3b3;
            border-radius: 50%;
            opacity: 0;
            transition: opacity 1s ease;
            box-shadow: 78px 0 0 #ffb3b3; 
        }
        .blush.show { opacity: 1; }

        .hand {
            position: absolute;
            width: 20px;
            height: 12px;
            background-color: #fdfae6;
            border-radius: 20px;
            bottom: 15px;
            z-index: 6;
        }
        .hand.left { left: -5px; transform: rotate(-20deg); }
        .hand.right { right: -5px; transform: rotate(20deg); }

        /* Steam Vapor */
        .steam {
            position: absolute;
            top: 20px; 
            left: 50%;
            transform: translateX(-50%) scale(0);
            width: 30px;
            height: 30px;
            background-color: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            filter: blur(5px);
            opacity: 1;
            pointer-events: none;
            z-index: 4;
            transition: transform 1.5s ease-out, top 1.5s ease-out, opacity 1.5s ease-out;
        }
        .steam.grow {
            transform: translateX(-50%) scale(4.5);
            top: -60px;
            opacity: 0;
        }

        /* --- HORIZON BABY FLOWERS --- */
        .ground-flowers {
            position: absolute;
            bottom: 30%; 
            left: 0;
            width: 100%;
            height: 0;
            pointer-events: none;
            z-index: 4;
        }

        .baby-flower {
            position: absolute;
            bottom: 0; 
            width: 20px;
            height: 40px;
            transform-origin: bottom center;
            transform: scale(0); 
            transition: transform 1.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .ground-flowers.visible .baby-flower { transform: scale(1); }

        .flower-g1 { left: 6%; transition-delay: 0.1s; }
        .flower-g2 { left: 18%; transition-delay: 0.2s; }
        .flower-g3 { left: 30%; transition-delay: 0.3s; }
        .flower-g4 { right: 30%; transition-delay: 0.3s; }
        .flower-g5 { right: 18%; transition-delay: 0.2s; }
        .flower-g6 { right: 6%; transition-delay: 0.1s; }

        .baby-stem {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 2.5px;
            height: 0px; 
            background-color: #4caf50;
            border-radius: 1px;
            transition: height 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .ground-flowers.visible .baby-flower .baby-stem { height: 30px; }

        .baby-head {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 1px;
            height: 1px;
            transition: bottom 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .ground-flowers.visible .baby-flower .baby-head { bottom: 30px; }

        .baby-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 6px;
            height: 6px;
            background: radial-gradient(circle, #ffe066, #d4af37);
            border-radius: 50%;
            z-index: 2;
        }

        .baby-petal {
            position: absolute;
            width: 6px;
            height: 12px;
            background: linear-gradient(to top, #ff758c 0%, #ff7eb3 100%);
            border-radius: 50% 50% 20% 20%;
            left: 50%;
            bottom: 0; 
            transform-origin: bottom center;
            transform: translateX(-50%) rotate(var(--angle));
            z-index: 1;
        }
    </style>
</head>
<body id="changing">

    <div class="sun" id="sun"></div>

    <div class="mountains">
        <div class="mountain mountain-1"></div>
        <div class="mountain mountain-2"></div>
        <div class="mountain mountain-3"></div>
        <div class="mountain mountain-4"></div>
    </div>
    <div class="ground"></div>
    
    <div class="ground-flowers" id="groundFlowers">
        <div class="baby-flower flower-g1"><div class="baby-stem"></div><div class="baby-head"><div class="baby-center"></div><div class="baby-petal" style="--angle: 0deg;"></div><div class="baby-petal" style="--angle: 90deg;"></div><div class="baby-petal" style="--angle: 180deg;"></div><div class="baby-petal" style="--angle: 270deg;"></div></div></div>
        <div class="baby-flower flower-g2"><div class="baby-stem"></div><div class="baby-head"><div class="baby-center"></div><div class="baby-petal" style="--angle: 0deg;"></div><div class="baby-petal" style="--angle: 90deg;"></div><div class="baby-petal" style="--angle: 180deg;"></div><div class="baby-petal" style="--angle: 270deg;"></div></div></div>
        <div class="baby-flower flower-g3"><div class="baby-stem"></div><div class="baby-head"><div class="baby-center"></div><div class="baby-petal" style="--angle: 0deg;"></div><div class="baby-petal" style="--angle: 90deg;"></div><div class="baby-petal" style="--angle: 180deg;"></div><div class="baby-petal" style="--angle: 270deg;"></div></div></div>
        <div class="baby-flower flower-g4"><div class="baby-stem"></div><div class="baby-head"><div class="baby-center"></div><div class="baby-petal" style="--angle: 0deg;"></div><div class="baby-petal" style="--angle: 90deg;"></div><div class="baby-petal" style="--angle: 180deg;"></div><div class="baby-petal" style="--angle: 270deg;"></div></div></div>
        <div class="baby-flower flower-g5"><div class="baby-stem"></div><div class="baby-head"><div class="baby-center"></div><div class="baby-petal" style="--angle: 0deg;"></div><div class="baby-petal" style="--angle: 90deg;"></div><div class="baby-petal" style="--angle: 180deg;"></div><div class="baby-petal" style="--angle: 270deg;"></div></div></div>
        <div class="baby-flower flower-g6"><div class="baby-stem"></div><div class="baby-head"><div class="baby-center"></div><div class="baby-petal" style="--angle: 0deg;"></div><div class="baby-petal" style="--angle: 90deg;"></div><div class="baby-petal" style="--angle: 180deg;"></div><div class="baby-petal" style="--angle: 270deg;"></div></div></div>
    </div>

    <div class="mainText">
        <h1 id="greeting">Eid Mubarak</h1>
        <h2 id="greeting2">May Allah grant you Afiyah in this world and the next, and may He accept every single one of your secret prayers.</h2>
    </div>
    
    <div class="container">
        <div class="scene-group" id="dumplingScene">
            
            <div class="steam" id="dumplingSteam"></div>

            <img src="/goat-clipart-md.png" class="goat" id="dumplingGoat" alt="Celebration Goat">

            <div class="dumpling">
                <div class="dumpling-face">
                    <div class="eye"></div>
                    <div class="eye"></div>
                </div>
                <div class="blush" id="dumplingBlush"></div>
                
                <div class="hand left"></div>
                <div class="hand right"></div>
            </div>

        </div>
    </div>

    <script>
        const scene = document.getElementById('dumplingScene');
        const steam = document.getElementById('dumplingSteam');
        const sun = document.getElementById('sun'); 
        const goat = document.getElementById('dumplingGoat'); // Linked the goat element
        const backChange = document.getElementById('changing');
        const greeting = document.getElementById('greeting');
        const greeting2 = document.getElementById('greeting2');
        const blush = document.getElementById('dumplingBlush');
        const groundFlowers = document.getElementById('groundFlowers'); 
        const groundElement = document.querySelector('.ground');

        scene.addEventListener('click', () => {
            // Trigger layouts & animations across all viewports
            steam.classList.add('grow');
            sun.classList.add('show'); 
            goat.classList.add('show'); // Animates the goat onto the screen
            blush.classList.add('show');
            greeting.classList.add('show');
            greeting2.classList.add('show');
            groundFlowers.classList.add('visible');
            groundElement.classList.add('changed');
            backChange.classList.add('yes');

            // Deactivate click interface once deployed
            scene.style.pointerEvents = 'none';
        });
    </script>
</body>
</html>
